server:
  port: 8081

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/auth/**

        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
