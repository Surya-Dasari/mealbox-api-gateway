server:
  port: 9100

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
      routes:
        - id: auth-service
          uri: http://localhost:9101
          predicates:
            - Path=/auth/**

        - id: restaurant-service
          uri: http://localhost:9102
          predicates:
            - Path=/restaurants/**

        - id: inventory-service
          uri: http://localhost:9105
          predicates:
            - Path=/inventory/**

        - id: cart-service
          uri: http://localhost:9103
          predicates:
            - Path=/cart/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
